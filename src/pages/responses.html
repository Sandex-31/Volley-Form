<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../common/theme-init.js"></script>
    <title>Form Responses - Volleyball</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body), 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: var(--surface);
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: var(--text);
            font-family: var(--font-head);
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header h1 [data-icon] {
            color: var(--accent);
            display: inline-flex;
        }

        .header p {
            color: var(--text-2);
            font-size: 16px;
            margin-bottom: 5px;
        }

        .header .meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 15px;
        }

        .responses-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .response-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
            text-align: left;
        }

        .response-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .response-date {
            color: var(--accent);
            font-weight: 700;
            font-size: 16px;
        }

        .response-time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .response-index {
            background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .response-section {
            margin-bottom: 25px;
        }

        .response-section h3 {
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .exercise-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 15px;
        }

        .exercise-name {
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .exercise-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .rating-stars {
            font-size: 18px;
            min-width: 30px;
        }

        .rating-text {
            color: var(--text-muted);
            font-size: 12px;
        }

        .exercise-note {
            color: var(--text-muted);
            font-size: 12px;
        }

        .notes-section {
            background: var(--surface-2);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            font-size: 14px;
            line-height: 1.6;
            font-style: italic;
        }

        .notes-section.empty {
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- ===== NAVIGATION BAR ===== -->
    <nav class="navbar" id="siteNav">
        <a href="index.html" class="navbar-brand">
            <img src="../assets/logo-wapatanka.png" alt="Wapatanka" class="navbar-logo"> <span>Wapatanka</span>
        </a>
        <ul class="navbar-menu" id="navMenu">
            <li class="navbar-item"><a href="index.html"><span class="nav-ic" data-icon="home"></span> Home</a></li>
            <li class="navbar-item"><a href="form.html"><span class="nav-ic" data-icon="form"></span> Rate Form</a></li>
            <li class="navbar-item"><a href="public-exercises.html"><span class="nav-ic" data-icon="exercises"></span> Exercises</a></li>
            <li class="navbar-item active"><a href="responses.html"><span class="nav-ic" data-icon="responses"></span> Responses</a></li>
            <li class="navbar-item"><a href="match-table.html"><span class="nav-ic" data-icon="matches"></span> Matches</a></li>
            <li class="navbar-item"><a href="players.html"><span class="nav-ic" data-icon="players"></span> Players</a></li>
            <li class="navbar-item"><a href="ai-analysis.html"><span class="nav-ic" data-icon="ai"></span> AI Analysis</a></li>
            <li class="navbar-item"><a href="upload-exercises.html"><span class="nav-ic" data-icon="manage"></span> Manage</a></li>
        </ul>
        <div class="navbar-actions">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="ThemeToggle.toggle()" aria-label="Cambia tema" type="button">
                <span class="icon-sun" data-icon="sun"></span><span class="icon-moon" data-icon="moon"></span>
            </button>
            <button class="navbar-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" type="button">☰</button>
        </div>
    </nav>

    <div class="container reveal">
        <div class="header">
            <h1><span data-icon="responses"></span> Form Responses</h1>
            <p>View all submitted form responses</p>
            <p class="meta">Total responses received: <span id="responseCount" style="color: var(--accent); font-weight: bold;">0</span></p>
        </div>

        <!-- Responses List Container -->
        <div id="responsesList" class="responses-list reveal">
            <p class="loading" style="text-align: center; color: var(--text-muted); font-style: italic;">Loading responses...</p>
        </div>

    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- ===== CONFIGURATION & CONSTANTS ===== -->
    <script src="../config/firebase.config.js"></script>
    <script src="../config/supabase.config.js"></script>
    <script src="../config/constants.js"></script>

    <!-- ===== COMMON SERVICES ===== -->
    <script src="../common/logger.js"></script>
    <script src="../common/storage-service.js"></script>
    <script src="../common/ui-service.js"></script>

    <!-- ===== DATA SERVICES ===== -->
    <script src="../services/firebase-service.js"></script>
    <script src="../services/exercise-service.js"></script>

    <!-- ===== UI COMMON ===== -->
    <script src="../common/icons.js"></script>
    <script src="../common/navbar.js"></script>
    <script src="../common/scroll-reveal.js"></script>

    <!-- ===== RESPONSES MODULE ===== -->
    <script src="../modules/responses/responses.js"></script>
</body>
</html>
