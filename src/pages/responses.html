<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Responses - Volleyball</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: #242d47;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #3a4560;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #f0f4f8;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #d0d9e8;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .header .meta {
            color: #999;
            font-size: 14px;
            margin-top: 15px;
        }

        .responses-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .response-card {
            background: #242d47;
            border: 1px solid #3a4560;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            text-align: left;
        }

        .response-card:hover {
            border-color: #5b7cfa;
            box-shadow: 0 8px 25px rgba(91, 124, 250, 0.15);
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3a4560;
        }

        .response-date {
            color: #5b7cfa;
            font-weight: 700;
            font-size: 16px;
        }

        .response-time {
            color: #999;
            font-size: 12px;
        }

        .response-index {
            background: linear-gradient(135deg, #5b7cfa 0%, #748ffc 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .response-section {
            margin-bottom: 25px;
        }

        .response-section h3 {
            color: #f0f4f8;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .exercise-card {
            background: #2d3854;
            border: 1px solid #3a4560;
            border-radius: 8px;
            padding: 15px;
        }

        .exercise-name {
            color: #5b7cfa;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .exercise-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .rating-stars {
            font-size: 18px;
            min-width: 30px;
        }

        .rating-text {
            color: #d0d9e8;
            font-size: 12px;
            color: #999;
        }

        .exercise-note {
            color: #d0d9e8;
            font-size: 12px;
            color: #999;
        }

        .notes-section {
            background: #2d3854;
            border-left: 4px solid #5b7cfa;
            padding: 15px;
            border-radius: 5px;
            color: #d0d9e8;
            font-size: 14px;
            line-height: 1.6;
            font-style: italic;
        }

        .notes-section.empty {
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Form Responses</h1>
            <p>View all submitted form responses</p>
            <p class="meta">Total responses received: <span id="responseCount" style="color: #5b7cfa; font-weight: bold;">0</span></p>
        </div>

        <!-- Responses List Container -->
        <div id="responsesList" class="responses-list">
            <p class="loading" style="text-align: center; color: #999; font-style: italic;">Loading responses...</p>
        </div>

        <!-- Navigation -->
        <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #3a4560; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="index.html" style="display: inline-block; padding: 10px 40px; background: #3a4560; color: #d0d9e8; text-decoration: none; border-radius: 5px; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.background='#4a5575'" onmouseout="this.style.background='#3a4560'">📋 Back to Form</a>
            <a href="public-exercises.html" style="display: inline-block; padding: 10px 40px; background: #3a4560; color: #d0d9e8; text-decoration: none; border-radius: 5px; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.background='#4a5575'" onmouseout="this.style.background='#3a4560'">🏐 View Exercises</a>
        </div>
    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- ===== CONFIGURATION & CONSTANTS ===== -->
    <script src="../config/firebase.config.js"></script>
    <script src="../config/supabase.config.js"></script>
    <script src="../config/constants.js"></script>

    <!-- ===== COMMON SERVICES ===== -->
    <script src="../common/logger.js"></script>
    <script src="../common/storage-service.js"></script>
    <script src="../common/ui-service.js"></script>

    <!-- ===== DATA SERVICES ===== -->
    <script src="../services/firebase-service.js"></script>
    <script src="../services/exercise-service.js"></script>

    <!-- ===== RESPONSES MODULE ===== -->
    <script src="../modules/responses/responses.js"></script>
</body>
</html>
