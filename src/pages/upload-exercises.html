<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exercises - Admin Panel</title>
    <link rel="stylesheet" href="../styles/upload-exercises.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Manage Exercises</h1>
            <p>Add, edit, and manage training exercises</p>
        </div>

        <!-- Messages -->
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="infoMessage" class="info-message"></div>

        <!-- Login Section -->
        <div id="loginSection">
            <h2 style="color: #f0f4f8; margin-bottom: 20px; font-size: 18px; font-weight: 700;">Admin Authentication</h2>
            <div class="form-group">
                <label for="adminPassword">Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password..." autofocus>
            </div>
            <button class="btn-save" id="loginBtn">🔑 Login</button>
        </div>

        <!-- Upload Section (Hidden by default) -->
        <div id="uploadSection" style="display: none;">
            <div style="text-align: right; margin-bottom: 20px;">
                <button class="btn-secondary" id="logoutBtn" style="width: auto; padding: 8px 16px; font-size: 12px;">Logout</button>
            </div>

            <!-- Exercise List Section -->
            <div class="section">
                <h2>📋 Scheduled Exercises</h2>
                <div id="exercisesList"></div>
                <button type="button" class="btn-save" onclick="ExerciseUploadManager.addNewExercise()">➕ Add New Exercise</button>
            </div>
        </div>

        <!-- Back Link -->
        <div class="back-link">
            <a href="index.html">← Back to Form</a>
            <a href="public-exercises.html">🏐 View Exercises</a>
        </div>
    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- ===== SUPABASE SDK ===== -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- ===== CONFIGURATION & CONSTANTS ===== -->
    <script src="../config/firebase.config.js"></script>
    <script src="../config/supabase.config.js"></script>
    <script src="../config/constants.js"></script>

    <!-- ===== COMMON SERVICES ===== -->
    <script src="../common/logger.js"></script>
    <script src="../common/storage-service.js"></script>
    <script src="../common/ui-service.js"></script>

    <!-- ===== DATA SERVICES ===== -->
    <script src="../services/firebase-service.js"></script>
    <script src="../services/exercise-service.js"></script>

    <!-- ===== FORM VALIDATION ===== -->
    <script src="../modules/form/validation.js"></script>

    <!-- ===== EXERCISE UPLOAD MODULE ===== -->
    <script src="../modules/exercises/upload-manager.js"></script>
</body>
</html>
